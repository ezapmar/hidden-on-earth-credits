<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Play Hidden on Earth in the browser: 19 famous paintings with things hiding in them. No account, no ads, no clock.">
<title>Play Hidden on Earth: Seek &amp; Find</title>
<link rel="icon" href="/assets/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#3A2A22">
<style>
  :root {
    --night: #3a2a22; --bone: #f2ece1; --vermilion: #e2512f; --leaf: #3f7d57;
    --gold: #f2b134; --pink: #e86a9a; --paper: #f5e9cc; --sepia: #40301f;
    --panel: rgba(255,255,255,.06); --edge: rgba(255,255,255,.14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--night); color: var(--bone);
    font: 500 16px/1.4 "Hanken Grotesk", system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  body[data-screen="book"] { background: var(--paper); color: var(--sepia); }
  h1, h2, h3 { font-family: Outfit, system-ui, sans-serif; margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .symbol { width: 1.5em; height: 1.5em; display: block; }
  .symbol.star { color: var(--gold); }
  .symbol.big { width: 3.5rem; height: 3.5rem; }

  /* ---------------------------------------------------------------- screens */
  #status { padding: 2rem; opacity: .7 }
  #home, #book { height: 100%; overflow-y: auto; padding: 0 0 3rem;
                 padding-bottom: calc(3rem + env(safe-area-inset-bottom)); }
  #game { height: 100%; display: flex; flex-direction: column;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  [hidden] { display: none !important }

  /* ------------------------------------------------------------- the picker */
  /* One slim bar, pinned: who we are on the left, the sticker book on the right. The picker
     used to open on a tall centred title that took half the screen; the screen belongs to
     the paintings. Same bar as the iPad app. */
  .home-bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: .7rem;
    padding: .6rem clamp(1rem, 4vw, 2rem); padding-top: calc(.6rem + env(safe-area-inset-top));
    background: rgba(58,42,34,.94); border-bottom: 1px solid var(--edge);
  }
  .home-bar .logo { width: 2.6rem; height: 2.6rem; border-radius: 22%; flex: 0 0 auto; display: block; }
  .home-bar h1 { font-size: clamp(1.25rem, 3.4vw, 1.6rem); font-weight: 800; white-space: nowrap; }
  .home-bar .spacer { flex: 1 1 auto; }
  #home .row:first-of-type { margin-top: 1.4rem; }
  .book-button {
    display: flex; align-items: center; gap: .5rem; font-weight: 700; white-space: nowrap;
    padding: .55rem 1rem; border-radius: 999px; background: var(--panel);
    border: 2px solid rgba(242,177,52,.45);
  }
  /* On a narrow screen the bar gives up the name before the button gives up its words. */
  @media (max-width: 480px) { .home-bar h1 { display: none } }
  @media (max-width: 300px) { .book-button .words { display: none } }
  .book-button:active { transform: translateY(1px) }

  .row { margin: 0 0 2.1rem; }
  .row-head { display: flex; align-items: center; gap: .7rem; padding: 0 clamp(1rem, 4vw, 2rem) .8rem; }
  .row-head h2 { font-size: clamp(1.25rem, 3.6vw, 1.7rem); font-weight: 800; }
  .row-symbol {
    width: 2.5rem; height: 2.5rem; display: grid; place-items: center; flex: 0 0 auto;
    border-radius: 50%; background: var(--panel); color: var(--vermilion);
  }
  .row-symbol.personal { color: var(--pink) }
  .row-count {
    display: inline-flex; align-items: center; gap: .35rem; font-size: .85rem; font-weight: 700;
    padding: .25rem .6rem; border-radius: 999px; background: var(--panel); opacity: .75;
  }
  .row-count.all { opacity: 1; color: var(--gold) }
  .row-count .symbol { width: 1em; height: 1em }

  .strip {
    display: flex; gap: 1rem; overflow-x: auto; padding: .4rem clamp(1rem, 4vw, 2rem) .8rem;
    scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  }
  .card-painting {
    flex: 0 0 min(72vw, 270px); scroll-snap-align: start; text-align: left;
    display: flex; flex-direction: column; gap: .6rem; padding: .7rem;
    background: var(--panel); border-radius: 20px; border: 1px solid transparent;
  }
  .card-painting.done { background: rgba(242,177,52,.10); border-color: rgba(242,177,52,.35) }
  .card-painting:not(.add):active { transform: translateY(2px) }
  .card-art { position: relative; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #2b1f19; }
  .card-art picture, .card-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card-art.dashed {
    display: grid; place-items: center; color: var(--pink);
    background: rgba(232,106,154,.08); border: 3px dashed rgba(232,106,154,.5);
  }
  .card-star {
    position: absolute; top: .5rem; right: .5rem; width: 2.2rem; height: 2.2rem;
    display: grid; place-items: center; border-radius: 50%; background: rgba(0,0,0,.55);
  }
  .card-meta h3 { font-size: 1.05rem; font-weight: 700; }
  .card-meta .artist { margin: .15rem 0 0; font-size: .85rem; opacity: .6 }
  .card-meta .count { margin: .35rem 0 0; font-size: .85rem; font-weight: 700; color: var(--vermilion) }
  .card-meta .count.done { color: var(--gold) }
  .bar { margin-top: .4rem; height: 7px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden }
  .bar i { display: block; height: 100%; background: var(--vermilion); border-radius: 999px }

  /* -------------------------------------------------------- the sticker book */
  .book-head { display: grid; justify-items: center; gap: .2rem; padding: 2.2rem 1rem 1.4rem; text-align: center }
  .book-head h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); font-weight: 800 }
  .book-head .lead { margin: 0; opacity: .7; font-weight: 600 }
  .back {
    position: fixed; top: calc(.8rem + env(safe-area-inset-top)); left: .8rem; z-index: 2;
    width: 3rem; height: 3rem; display: grid; place-items: center; border-radius: 50%;
    background: rgba(64,48,31,.12); border: 2px solid rgba(64,48,31,.25); color: var(--sepia);
  }
  .book-row { margin: 0 0 2rem; padding: 0 clamp(1rem, 4vw, 2rem) }
  .book-row .row-head { padding: 0 0 .8rem }
  .book-row .row-symbol { background: rgba(64,48,31,.10) }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 1.1rem }
  .slot { display: grid; justify-items: center; gap: .5rem }
  .disc {
    width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: rgba(64,48,31,.08); border: 3px dashed rgba(64,48,31,.22);
  }
  .slot.unlocked .disc { border: 4px solid var(--gold); background: #fff; box-shadow: 0 4px 14px rgba(64,48,31,.22) }
  .disc picture, .disc img { display: block; width: 100%; height: 100%; object-fit: cover }
  .disc .locked { font-size: 1.8rem; font-weight: 800; opacity: .3 }
  /* A fixed two-line box, as the Swift book uses, so a long title does not shunt its row
     down relative to its neighbours. */
  .slot-name {
    font-size: .82rem; font-weight: 700; text-align: center; line-height: 1.2;
    min-height: 2.4em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .slot:not(.unlocked) .slot-name { opacity: .45 }
  .slot:active { transform: translateY(2px) }

  /* ---------------------------------------------------------------- the game */
  #game header { display: flex; gap: .75rem; align-items: center; padding: .6rem .9rem; flex: 0 0 auto; }
  #game h1 { font-size: 1rem; font-weight: 700 }
  .artist { font-size: .8rem; opacity: .6 }
  #game header .spacer { flex: 1 }
  #game header button {
    font-size: .85rem; background: #272430; border: 1px solid var(--edge);
    border-radius: 10px; padding: .4rem .7rem;
  }
  #game header button:active { transform: translateY(1px) }
  .pill { background: var(--vermilion); border-color: transparent; font-weight: 700 }
  #back-home { display: grid; place-items: center; padding: .35rem }

  /* minmax(0, 1fr) matters: an implicit grid row is `auto`, so it sizes to the painting
     and a percentage max-height on the item resolves against that, not against the
     flex-constrained wrapper. The painting then overflows and covers the HUD. */
  #stage-wrap {
    flex: 1 1 auto; position: relative; display: grid; place-items: center;
    grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
    min-height: 0; padding: 0 .5rem;
  }
  /* The viewport is the container the ported Viewport maths is written against: a fixed box
     that clips. #stage is the aspect-fit painting at scale 1, moved by a transform. */
  #viewport {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  /* #stage IS the fitted painting box, because every ring is positioned as a percentage of
     it. JavaScript sets its pixel size from Viewport.fitRect and positions it with a single
     transform, so the browser composites zoom and pan on the GPU. */
  #stage {
    position: absolute; left: 50%; top: 50%; line-height: 0;
    transform: translate(-50%, -50%); transform-origin: 50% 50%; will-change: transform;
  }
  #stage picture { display: contents }
  #stage img { display: block; width: 100%; height: 100%; border-radius: 6px; pointer-events: none }
  .ring, .hintring, #miss {
    position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
    pointer-events: none; aspect-ratio: 1;
  }
  .ring { border: calc(4px / var(--s, 1)) solid var(--vermilion); animation: pop .35s ease-out }
  .hintring { border: calc(4px / var(--s, 1)) dashed var(--gold); animation: breathe 1s ease-in-out infinite }
  #miss { width: calc(44px / var(--s, 1)); border: calc(3px / var(--s, 1)) solid rgba(242,236,225,.85); opacity: 0 }
  #miss.go { animation: ripple .5s ease-out }
  @keyframes pop { from { transform: translate(-50%,-50%) scale(.4); opacity: 0 } }
  @keyframes breathe { 50% { transform: translate(-50%,-50%) scale(1.12) } }
  @keyframes ripple { from { opacity: .9; transform: translate(-50%,-50%) scale(.3) } to { opacity: 0; transform: translate(-50%,-50%) scale(1.8) } }
  @media (prefers-reduced-motion: reduce) {
    .ring, .hintring, #miss.go { animation: none } #miss.go { opacity: 0 }
    .card-painting:active, .slot:active, .book-button:active { transform: none }
  }
  #zoom { position: absolute; right: .6rem; bottom: .6rem; display: flex; flex-direction: column; gap: .35rem }
  #zoom button {
    width: 2.4rem; height: 2.4rem; font-size: 1.1rem; line-height: 1; border-radius: 10px;
    background: rgba(27,32,41,.86); border: 1px solid var(--edge);
  }
  #zoom button[disabled] { opacity: .35; cursor: default }
  #hud { flex: 0 0 auto; display: flex; gap: .5rem; overflow-x: auto; padding: .6rem .9rem calc(.6rem + env(safe-area-inset-bottom)) }
  .card {
    display: flex; align-items: center; gap: .5rem; flex: 0 0 auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 12px;
    padding: .4rem .7rem .4rem .45rem;
  }
  .card[data-done] { border-color: var(--leaf); background: rgba(63,125,87,.18) }
  .card picture, .card img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: block }
  .card .name { font-size: .85rem }
  .card .count { font-size: .78rem; opacity: .65; font-variant-numeric: tabular-nums }
  /* ------------------------------------------------------------ rotate hint
     A wide painting fitted into a tall phone screen is tiny: on a 375x812 phone the picture
     occupies about a third of the height and the rest is dead space. The Swift app sidesteps
     this by locking iPhone to landscape (UISupportedInterfaceOrientations); the Android shell
     does the same on phones. The web cannot lock, so it asks. Phones only: 600px is below
     every tablet in portrait (iPad mini is 744) and above every phone. */
  #rotate { display: none }
  @media (orientation: portrait) and (max-width: 600px) {
    body[data-screen="game"] #rotate {
      position: fixed; inset: 0; z-index: 20; display: grid; place-content: center;
      justify-items: center; gap: 1.2rem; padding: 2rem; text-align: center;
      background: var(--night);
    }
    body[data-screen="game"] #rotate svg { width: 5rem; height: 5rem; color: var(--gold) }
    body[data-screen="game"] #rotate p { margin: 0; font-size: 1.15rem; font-weight: 700; max-width: 18ch }
    @media (prefers-reduced-motion: no-preference) {
      body[data-screen="game"] #rotate svg { animation: tilt 2.4s ease-in-out infinite }
    }
  }
  @keyframes tilt { 0%, 40%, 100% { transform: rotate(0) } 60%, 90% { transform: rotate(-90deg) } }

  #win {
    position: absolute; inset: 0; display: grid; place-content: center; gap: .8rem; justify-items: center;
    background: rgba(28,26,36,.85); text-align: center; padding: 1rem;
  }
  #win p { font-size: 1.4rem; margin: 0; font-weight: 800 }
  #win button { background: var(--vermilion); border-radius: 12px; padding: .55rem 1.1rem; font-weight: 700 }
</style>
</head>
<body>
<div id="status">Loading the catalogue…</div>

<main id="home" hidden></main>
<main id="book" hidden></main>

<main id="game" hidden>
  <header>
    <button id="back-home" title="Paintings" aria-label="Paintings">
      <svg viewBox="0 0 24 24" class="symbol" aria-hidden="true"><path fill="currentColor" d="M3 3h8v8H3Zm10 0h8v8h-8ZM3 13h8v8H3Zm10 0h8v8h-8Z"/></svg>
    </button>
    <h1 id="title">…</h1>
    <span class="artist" id="artist"></span>
    <span class="spacer"></span>
    <button id="hint" class="pill">Hint</button>
  </header>

  <div id="stage-wrap">
    <div id="viewport">
      <div id="stage">
        <picture>
          <source id="painting-avif" type="image/avif">
          <img id="painting" alt="" draggable="false">
        </picture>
        <span id="miss"></span>
      </div>
      <div id="zoom">
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">&minus;</button>
        <button id="zoom-fit" title="Show the whole painting" aria-label="Show the whole painting">&#9633;</button>
      </div>
      <div id="win" hidden><p id="win-text">You found them all!</p><button id="again">Play again</button></div>
    </div>
  </div>

  <div id="hud"></div>

  <div id="rotate">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"
            d="M7 2.5h10a1.5 1.5 0 0 1 1.5 1.5v16a1.5 1.5 0 0 1-1.5 1.5H7A1.5 1.5 0 0 1 5.5 20V4A1.5 1.5 0 0 1 7 2.5Z"/>
      <circle cx="12" cy="18.3" r=".9" fill="currentColor"/>
    </svg>
    <p id="rotate-text"></p>
  </div>
</main>

<script type="module" src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
  }
</script>
</body>
</html>
